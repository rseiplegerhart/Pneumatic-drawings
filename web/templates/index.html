<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pneumatic Drawing Generator</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Pneumatic Drawing Generator</h1>
    <p>ISO 1219-1 &mdash; Fill in the form below and click <strong>Generate PDF</strong></p>
  </header>

  <main>
    <!-- Drawing Info -->
    <section class="card">
      <h2>Drawing Information</h2>
      <div class="grid-3">
        <label>Title
          <input type="text" id="title" value="Pneumatic Circuit" placeholder="Circuit title">
        </label>
        <label>Drawn By
          <input type="text" id="drawn_by" placeholder="Your name">
        </label>
        <label>Date
          <input type="date" id="date" value="{{ today }}">
        </label>
      </div>
    </section>

    <!-- Components -->
    <section class="card">
      <div class="section-header">
        <h2>Components</h2>
        <button class="btn-add" onclick="addComponent()">+ Add Component</button>
      </div>
      <div id="components-list">
        <!-- rows injected by JS -->
      </div>
      <p class="hint" id="no-components">No components added yet. Click <em>+ Add Component</em> to start.</p>
    </section>

    <!-- Connections -->
    <section class="card">
      <div class="section-header">
        <h2>Connections</h2>
        <button class="btn-add" onclick="addConnection()">+ Add Connection</button>
      </div>
      <div id="connections-list"></div>
      <p class="hint" id="no-connections">No connections added yet.</p>
    </section>

    <!-- Generate -->
    <div class="generate-row">
      <button class="btn-generate" onclick="generate()">&#9660; Generate PDF</button>
      <span id="status"></span>
    </div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
